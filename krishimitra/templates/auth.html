{% extends "base.html" %}
{% block body %}
<form class="card narrow" method="post">
  <h2>{{ t(mode) }}</h2>
  <label>{{ t('username') }}<input name="username" required></label>
  <label>{{ t('password') }}<input name="password" type="password" required></label>
  <button class="btn">{{ t(mode) }}</button>
  <p class="small">
    {% if mode == 'login' %}<a href="{{ url_for('register') }}">{{ t('register') }}</a>
    {% else %}<a href="{{ url_for('login') }}">{{ t('login') }}</a>{% endif %}
  </p>
</form>
{% endblock %}
